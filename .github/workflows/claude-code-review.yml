name: Claude Code Review

# Advisory automated review. Never a required check. Agents open PRs ready for
# review and merge their own, so this fires on opened/synchronize as well as
# ready_for_review (the four types track_progress supports).
#
# Skips cleanly (green) when: the PR is a draft, comes from a fork, is authored
# by dependabot/renovate (no repo secrets), or the CLAUDE_CODE_OAUTH_TOKEN
# secret has not been added yet. Never uses pull_request_target.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read

# Re-review on every push, but only the newest push per PR.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-advisory-review:
    name: Claude advisory review
    if: >-
      ${{ !github.event.pull_request.draft
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
      && github.event.pull_request.user.login != 'renovate[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write # post the review + inline comments
      id-token: write # OIDC exchange for the Claude GitHub App token
      actions: read # read CI results for the PR

    steps:
      # Secrets cannot appear in `if:`; expose presence as a step output instead.
      - name: Check for Claude token
        id: gate
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "CLAUDE_CODE_OAUTH_TOKEN is not set for this repo; skipping the advisory review."
          fi

      - name: Checkout repository
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        if: steps.gate.outputs.enabled == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "haynes-dev-bot"
          track_progress: true
          use_sticky_comment: true
          # Tom's October 5 quota direction reserves Opus for deliberate use.
          # Pin Sonnet for this advisory review; required CI remains separate.
          # The Bash and inline-comment grants below are what let Claude run
          # `gh` and post line comments at all.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 60
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"
          additional_permissions: |
            actions: read
          prompt: |
            You are the automated, advisory reviewer for Haynes Quest, a private
            novelty 3D browser game for Tom Haynes's family (TypeScript, Vite,
            Postgres, MkDocs Material asset studio). The PR branch is already
            checked out. Review PR #${{ github.event.pull_request.number }} of
            ${{ github.repository }}.

            ## Step 1 - context
            - `gh pr diff ${{ github.event.pull_request.number }}` for the changes
            - `gh pr view ${{ github.event.pull_request.number }}` for intent
            - Read `AGENTS.md` (CLAUDE.md points to it) and the docs it names that
              match the changed paths (`docs/PROCESS.md`, the relevant ADR/DESIGN/PLAN).
            - CI already runs typecheck, lint, tests, `levels:validate`, build and
              the strict MkDocs build; use `actions: read` to see their results and
              do not repeat what they cover. Do not repeat feedback already on the PR.

            ## Step 2 - what this repo cares about
            **CRITICAL - block the merge**
            - Secrets or private data in git, build output, logs or diagnostics:
              Immich credentials or URLs with tokens, OIDC/Better Auth secrets,
              database URLs, family photos or other private media, personal names
              or birthdays hard-coded in code, fixtures or docs. Fixtures must be
              clearly synthetic.
            - Private media placed under public git or MkDocs static inputs
              (`docs/`), or the fixture/ephemeral playtest gaining access to a
              real-release credential, database or the Immich Secret (ADR-006).
            - Auth and admission regressions (ADR-001, ADR-005): sign-in that is
              not Authentik-only, admission not checked at every sign-in against
              the verified ID token's groups claim, widened `/api/auth` surface,
              client-supplied provider/return path/ID token honored, weakened
              session or cookie flags, missing Origin checks.
            - Logic errors with real impact: races, unhandled null/undefined,
              server-owned state (equipment, health, encounter outcomes, memories,
              age progression) trusted from the client, unreleased timers or
              listeners, a changed signature whose callers were not updated.
            - Postgres migrations that edit or reorder an already-merged file in
              `migrations/` (they are append-only), or a destructive migration.

            **HIGH - should fix**
            - Asset changes without the same-PR catalog update (docs/PROCESS.md
              "Asset catalog must stay current"): the versioned review page under
              `docs/assets/reviews/`, `scripts/assets/catalog-inventory.json`,
              `docs/assets/catalog.md` (cards, counts, status) and regenerated
              thumbnails plus their manifest. Earlier asset versions must be kept.
            - A claim of Tom's approval, or gameplay use beyond
              `gameplay_use: "private-candidate"`, without his recorded decision on
              that exact asset version.
            - Gameplay contract breaks: an ability-gated path unreachable with the
              current ability set, progression gates bypassed, friendly creatures
              included in enemy targeting or boss gates, age inferred from photo
              coverage instead of an explicit age source, published or old routes
              not kept immutable, browser zoom re-enabled (WO090 no-zoom policy),
              or native iOS packaging introduced.
            - Behavior changed with no matching test change, or docs (ADR, DESIGN,
              PRD, runbook, handoff) not updated in the same PR. Accepted ADRs are
              immutable: flag edits to their decisions; they are superseded by a new
              ADR. Stable IDs (`R-NN`, `US-NN`, `AC-NN`, `Q-NN`, `D-NN`) must not
              be renumbered.
            - Swallowed errors or failure paths with no logging.
            - Cluster or deployment configuration added here instead of `haynes-ops`.
            - CI/workflow changes: new `pull_request_target`, widened permissions,
              untrusted input interpolated into `run:`, unpinned third-party actions
              beyond the repo's existing tag convention.

            **MEDIUM - consider**
            - Broken relative links or media references in docs, stale handoff or
              README counts, deployment claims ("deployed", "verified live") without
              evidence recorded.
            - Touch/mobile Safari regressions (iPad, iPhone, PC are the targets).

            **Ignore entirely:** formatting, naming, import order, missing docstrings
            on unchanged code, and feature suggestions beyond the PR's intent.

            ## Step 3 - report
            - Be concise. No praise, no restating the diff. Each finding: severity,
              file and line, the problem, and the fix.
            - Post each line-specific finding with
              `mcp__github_inline_comment__create_inline_comment` (`confirmed: true`),
              prefixing the body with its severity: `CRITICAL:`, `HIGH:` or `MEDIUM:`.
            - Then post ONE summary comment with `gh pr comment` containing a verdict
              (`Looks good` / `Needs changes` / `Has critical issues`) and the findings
              grouped by severity, each naming the file and line.
            - If the diff is clean, say exactly "No findings." followed by one sentence
              on what you checked. Never invent a finding to look thorough.
            - Only review files changed in this PR. Post GitHub comments only; do not
              return the review as chat text.

# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json
site_name: Haynes Quest
use_directory_urls: false

# `scripts/docs/prepare.py` creates this tree from docs/ and linked project records.
docs_dir: .docs-build
site_dir: site

theme:
  name: material
  language: en
  font: false
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Level editor: level-editor.md
  - Asset studio:
      - Overview: assets/README.md
      - Art direction: assets/art-direction.md
      - Browse all assets: assets/catalog.md
      - Two-chapter playtest: assets/playtest.md
      - Review template: assets/000-review-template.md
  - Product:
      - Project brief: prds/001-project-brief.md
      - Level editor MVP: prds/002-level-editor-mvp.md
      - Complete world authoring: prds/003-complete-world-authoring.md
      - PRD template: prds/000-template.md
      - Backlog: BACKLOG.md
  - Architecture:
      - Authentik sign-in: adrs/001-authentik-sign-in.md
      - Proposed web game stack: adrs/002-web-game-stack.md
      - Shared editor documents: adrs/003-shared-level-editor-documents.md
      - Versioned world projects: adrs/004-versioned-world-projects.md
      - ADR template: adrs/000-template.md
  - Domain language:
      - Ubiquitous language: domain-driven-design/001-ubiquitous-language.md
      - Domain template: domain-driven-design/000-template.md
  - Designs:
      - Technical foundation: designs/001-technical-foundation.md
      - Asset pipeline: designs/002-asset-pipeline.md
      - Photo connections and people: designs/003-photo-connections-and-people.md
      - Memory journey: designs/004-memory-journey.md
      - Era enemy catalog: designs/005-era-enemy-catalog.md
      - Memory age and abilities: designs/006-memory-age-and-abilities.md
      - PoC development loop: designs/007-poc-development-loop.md
      - Audio pipeline: designs/008-audio-pipeline.md
      - Overnight contracts: designs/009-overnight-contracts.md
      - Era combat loop: designs/010-era-combat-loop.md
      - Forgiving obby: designs/011-forgiving-obby.md
      - Player journey setup: designs/012-player-journey-curation.md
      - Friendly characters: designs/013-friendly-characters.md
      - The Besties encounter: designs/014-besties-encounter.md
      - Fresh playtest controls: designs/015-fresh-playtest-controls.md
      - Personalized authored levels: designs/016-authored-levels.md
      - Daughter playground adventures: designs/017-daughter-playgrounds.md
      - Familiar touch and recovery: designs/018-familiar-touch-and-recovery.md
      - Level editor workspace: designs/019-level-editor-workspace.md
      - Complete world builder: designs/020-complete-world-builder.md
      - Rat Casino level: designs/021-rat-casino-level.md
      - Design template: designs/000-template.md
  - Operations:
      - Hosting context: ops/001-hosting-context.md
      - Private preview: ops/002-private-preview.md
      - Era combat verification: ops/005-era-combat-verification.md
      - Activate dev-env: project/runbooks/activate-dev-env.md
      - Runbook template: ops/000-template.md
  - Project records:
      - Complete world builder: project/plans/completed/014-complete-world-builder.md
      - Haynesnightmares cast: project/plans/completed/015-haynesnightmares-asset-first.md
      - Vertical level authoring: project/plans/completed/013-vertical-level-authoring.md
      - Level editor MVP: project/plans/completed/012-level-editor-mvp.md
      - Familiar controls and checkpoints: project/plans/completed/011-familiar-controls-and-checkpoints.md
      - Parent-prepared memories: project/plans/010-parent-prepared-memories.md
      - Daughter playground MVP: project/plans/completed/009-daughter-playground-mvp.md
      - Mobile reliability and builder direction: project/plans/completed/008-mobile-reliability-and-builder-direction.md
      - Current handoff: project/HANDOFF.md
      - Fresh playtests and controls: project/plans/completed/007-playtest-reset-and-controls.md
      - Playtest feedback and Besties: project/plans/completed/006-playtest-polish-and-besties.md
      - Team and routing: project/TEAM.md
      - Completed overnight MVP: project/plans/completed/004-overnight-mvp.md
      - Completed era combat rebuild: project/plans/completed/005-era-combat-loop.md
      - Authoring tool setup: project/plans/completed/003-authoring-tool-setup.md
      - Foundation prototype: project/plans/002-foundation-prototype.md
      - Completed repository bootstrap: project/plans/completed/001-repository-bootstrap.md
      - Plan template: project/plans/000-template.md
      - Work-order template: project/work-orders/000-template.md
      - Dev-env activation prompt: project/prompts/001-activate-dev-env.md
      - Overnight MVP prompt: project/prompts/002-overnight-mvp.md
      - Contributor guide: project/contributor-guide.md
  - References:
      - Astra game workflows: reference/astra-game-workflows.md
      - Immich AppDaemon review: reference/immich-appdaemon.md
      - Repository conventions: reference/repository-conventions.md
  - Documentation process: PROCESS.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/studio.js
  - path: javascripts/vendor/model-viewer-4.3.1.min.mjs
    type: module

validation:
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn
